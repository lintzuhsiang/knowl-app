# ── nginx reverse proxy for knowl-app — Path A (no ALB) ─────────────────────
#
# Placement: /etc/nginx/sites-available/knowl.conf
#            ln -s ../sites-available/knowl.conf /etc/nginx/sites-enabled/
#
# TLS: managed by certbot + Let's Encrypt.
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d app.knowl.com -d api.knowl.com
#   (auto-renew is wired in via certbot's systemd timer)
#
# CRITICAL for SSE: proxy_buffering must be OFF on /api/ai/*, otherwise nginx
# holds the response until the buffer fills and the user sees nothing stream.
# Same with X-Accel-Buffering header — Express already sets it, but we set
# the upstream directive too because nginx wins ties.
#
# This config assumes a single-origin layout: SPA + API on the same host.
# If you split (SPA on S3+CloudFront, API on this host), drop the `/` block
# and just serve the API.

# Rate limit zone — IP-based first-line defense before reaching express.
# Express has app-level rate limiters too; this is a cheap pre-filter.
limit_req_zone $binary_remote_addr zone=knowl_api:10m rate=20r/s;

# ── HTTP → HTTPS redirect ──
server {
  listen 80;
  listen [::]:80;
  server_name app.knowl.com api.knowl.com;

  # Let certbot serve its ACME challenge over plaintext during renewal
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /                            { return 301 https://$host$request_uri; }
}

# ── HTTPS ──
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.knowl.com api.knowl.com;

  # certbot will inject these two lines on first run:
  # ssl_certificate     /etc/letsencrypt/live/app.knowl.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/app.knowl.com/privkey.pem;

  # Modern TLS only — drops TLS 1.0/1.1
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling (faster TLS handshake)
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  # Body limit matches express.json({ limit: '10mb' })
  client_max_body_size 12m;

  # ── SSE-aware proxy block (used for streaming AI endpoints) ──
  location ~ ^/api/ai/(chat|agent) {
    limit_req zone=knowl_api burst=30 nodelay;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    # CRITICAL: disable buffering so SSE tokens stream live
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Long-running streams — agent loop can take minutes
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
  }

  # ── Regular API (JSON) ──
  location /api/ {
    limit_req zone=knowl_api burst=40 nodelay;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
  }

  # ── Health check (no rate limit) ──
  location = /healthz {
    proxy_pass http://127.0.0.1:3001;
    access_log off;
  }

  # ── Static SPA (drop this block if you serve SPA from S3+CloudFront) ──
  root /var/www/knowl/dist;
  index index.html;

  # Hashed assets are immutable — cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every non-asset path serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Defense-in-depth security headers (helmet already sets most on /api/*;
  # these cover the static HTML response which helmet doesn't touch)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options             "SAMEORIGIN"   always;
  add_header X-Content-Type-Options      "nosniff"      always;
  add_header Referrer-Policy             "no-referrer"  always;
  # If you later want HSTS preload, submit https://hstspreload.org/ AFTER
  # this site has been HTTPS-only for at least a week.
}
