<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Knowl</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
    }

    body {
      background: transparent;
      /* iOS WKWebView: prevent long-press text selection / callout on canvas
         (text inputs and contenteditable still work normally because they
          override these via :focus or explicit `user-select: text`). */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      /* Avoid rubber-band overscroll on the body — canvas owns scrolling */
      overscroll-behavior: none;
    }

    /* Re-enable text selection where actually needed */
    input, textarea, [contenteditable="true"], .selectable-text {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* Safe-area padding for iPhone notch / dynamic island.
       Apply to elements via the .safe-top / .safe-bottom helper classes. */
    .safe-top    { padding-top:    env(safe-area-inset-top,    0); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
    .safe-left   { padding-left:   env(safe-area-inset-left,   0); }
    .safe-right  { padding-right:  env(safe-area-inset-right,  0); }

    #root {
      padding-top:    env(safe-area-inset-top,    0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
